apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dotnet-cicd
spec:
  project: default
  source:
    repoURL: https://github.com/oladapooloyede/dotnet-cicd
    targetRevision: master
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: sandbox
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
