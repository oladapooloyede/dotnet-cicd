apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ci-pipeline
  labels:
    app: ci-pipeline
spec:
  params:
    - name: git-url
      type: string
      description: The Git repository URL
    - name: git-revision
      type: string
      description: The Git revision to build
      default: master
    - name: image-name
      type: string
      description: The fully qualified image name to push
    - name: kustomize-repo-url
      type: string
      description: The Git repository URL containing the kustomize manifests

  workspaces:
    - name: shared-workspace

  tasks:
    - name: clone-repo
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: $(params.git-url)
        - name: REVISION
          value: $(params.git-revision)
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: build-and-push
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      runAfter:
        - clone-repo
      params:
        - name: IMAGE
          value: $(params.image-name):$(tasks.clone-repo.results.commit)
        - name: DOCKERFILE
          value: ./Dockerfile
        - name: CONTEXT
          value: .
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: kustomize-patch
      runAfter:
        - build-and-push
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: IMAGE
          value: $(tasks.build-and-push.results.IMAGE_URL)
        - name: KUSTOMIZE_REPO_URL
          value: $(params.kustomize-repo-url)
      taskSpec:
        params:
          - name: IMAGE
          - name: KUSTOMIZE_REPO_URL
        workspaces:
          - name: source
        steps:
          - name: clone-kustomize-repo
            image: alpine/git:latest
            script: |
              #!/usr/bin/env sh
              rm -rf $(workspaces.source.path)/_kustomize
              git clone $(params.KUSTOMIZE_REPO_URL) $(workspaces.source.path)/_kustomize
          - name: patch-and-push
            image: alpine/git:latest
            env:
              - name: GIT_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: git-credentials
                    key: token
              - name: GIT_USER
                valueFrom:
                  secretKeyRef:
                    name: git-credentials
                    key: username
            script: |
              #!/usr/bin/env sh
              set -e
              cd $(workspaces.source.path)/_kustomize/k8s
              sed -i "s|newName:.*|newName: $(params.IMAGE)|" kustomization.yaml
              cd $(workspaces.source.path)/_kustomize
              git remote set-url origin https://${GIT_USER}:${GIT_TOKEN}@github.com/oladapooloyede/dotnet-cicd.git
              git config user.email "tekton-pipeline@ci.local"
              git config user.name "Tekton Pipeline"
              git add k8s/kustomization.yaml
              git diff --cached --quiet && echo "No changes to commit" || {
                git commit -m "Update image to $(params.IMAGE)"
                git push origin master
              }
