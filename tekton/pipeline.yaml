apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: ci-pipeline
  labels:
    app: ci-pipeline
spec:
  params:
    - name: git-url
      type: string
      description: The Git repository URL
    - name: git-revision
      type: string
      description: The Git revision to build
      default: master
    - name: image-name
      type: string
      description: The fully qualified image name to push
    - name: kustomize-repo-url
      type: string
      description: The Git repository URL containing the kustomize manifests
    - name: namespace
      type: string
      description: The OpenShift namespace to deploy to

  workspaces:
    - name: shared-workspace

  tasks:
    - name: clone-repo
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: git-clone
          - name: namespace
            value: openshift-pipelines
      params:
        - name: URL
          value: $(params.git-url)
        - name: REVISION
          value: $(params.git-revision)
      workspaces:
        - name: output
          workspace: shared-workspace

    - name: build-and-push
      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task
          - name: name
            value: buildah
          - name: namespace
            value: openshift-pipelines
      runAfter:
        - clone-repo
      params:
        - name: IMAGE
          value: $(params.image-name)
        - name: DOCKERFILE
          value: ./Dockerfile
        - name: CONTEXT
          value: .
      workspaces:
        - name: source
          workspace: shared-workspace

    - name: kustomize-patch
      runAfter:
        - build-and-push
      workspaces:
        - name: source
          workspace: shared-workspace
      params:
        - name: NAMESPACE
          value: $(params.namespace)
        - name: IMAGE
          value: $(params.image-name)
        - name: KUSTOMIZE_REPO_URL
          value: $(params.kustomize-repo-url)
      taskSpec:
        params:
          - name: NAMESPACE
          - name: IMAGE
          - name: KUSTOMIZE_REPO_URL
        workspaces:
          - name: source
        steps:
          - name: clone-kustomize-repo
            image: alpine/git:latest
            script: |
              #!/usr/bin/env sh
              rm -rf $(workspaces.source.path)/_kustomize
              git clone $(params.KUSTOMIZE_REPO_URL) $(workspaces.source.path)/_kustomize
          - name: kustomize-patch
            image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
            script: |
              #!/usr/bin/env bash
              set -e
              cd $(workspaces.source.path)/_kustomize/k8s
              sed -i "s|newName: dotnet-pg-microservice|newName: $(params.IMAGE)|" kustomization.yaml
              oc apply -k . --server-side --force-conflicts \
                -n $(params.NAMESPACE)
